[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reforge-toolkit"
version = "0.1.0"
description = "Modular PyQt6 desktop framework for authorized reverse-engineering workflows"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.5",
  "pluggy>=1.3",
  "capstone>=5.0",
  "keystone-engine>=0.9.2",
  "lief>=0.14",
  "frida-tools>=12.0",
  "blinker>=1.7",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
reforge = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "plugins*"]

[tool.setuptools.package-data]
gui = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
