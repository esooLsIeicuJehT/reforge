[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reforge-toolkit"
version = "0.2.0"
description = "Modular PySide6 desktop framework for authorized reverse-engineering workflows"
readme = "readme.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
frida = [
  "frida-tools>=14.6.1",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
reforge = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "plugins*"]

[tool.setuptools.package-data]
gui = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
