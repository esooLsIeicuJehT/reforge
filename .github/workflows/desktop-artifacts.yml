name: Desktop Artifacts

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }} standalone
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build/runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libegl1 libgl1 libxkbcommon-x11-0

      - name: Install ReForge
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Build standalone application with Qt for Python deployment tool
        run: >-
          pyside6-deploy main.py
          --name ReForge
          --mode standalone
          --force
          --keep-deployment-files
          --extra-ignore-dirs=tests,docs,scripts,release-artifacts
          --verbose

      - name: Smoke-test and package artifact
        run: python scripts/prepare_release_artifact.py --platform "${{ matrix.label }}"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ReForge-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release-artifacts/*.zip
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS.txt
